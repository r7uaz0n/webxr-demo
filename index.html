<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>meandering the subconscious playground </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft">

      <!-- HTML overlay UI lives inside a-scene so it stays visible when -->
      <!-- the scene is the fullscreen element (Fullscreen API only renders -->
      <!-- the fullscreen element's own subtree). -->
      <div id="sound-hint" style="position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; padding: 10px 16px; font: 12px/1.2 sans-serif; letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; z-index: 10;">Click the cube to enable sound</div>
      <div id="page-title" style="position: fixed; top: 16px; left: 16px; color: rgba(255,255,255,0.85); font: 13px/1.2 sans-serif; letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; z-index: 20;">[WebXR sandbox]</div>
      <div id="sound-picker" style="position: fixed; top: 52px; left: 16px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 20;">
        <button data-sound="ambient-key" style="padding: 8px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: white; cursor: pointer;">Ambient Key</button>
        <button data-sound="glass-hum" style="padding: 8px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: white; cursor: pointer;">Glass Hum</button>
        <button data-sound="bell-tone" style="padding: 8px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: white; cursor: pointer;">Bell Tone</button>
        <button data-sound="drone-hit" style="padding: 8px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: white; cursor: pointer;">Drone Hit</button>
        <button data-sound="soft-pluck" style="padding: 8px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: white; cursor: pointer;">Soft Pluck</button>
      </div>
      <div id="reverb-control" style="position: fixed; top: 108px; left: 16px; z-index: 20; padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.2); color: white; font: 12px/1.2 sans-serif; backdrop-filter: blur(6px);">
        <label for="reverb-slider" style="display: block; margin-bottom: 6px; letter-spacing: 0.08em; text-transform: uppercase;">Delay</label>
        <input id="reverb-slider" type="range" min="0" max="1" step="0.01" value="0.4" style="width: 140px; accent-color: #dfe6ff;" />
      </div>
      <div id="volume-control" style="position: fixed; top: 166px; left: 16px; z-index: 20; padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.2); color: white; font: 12px/1.2 sans-serif; backdrop-filter: blur(6px);">
        <label for="volume-slider" style="display: block; margin-bottom: 6px; letter-spacing: 0.08em; text-transform: uppercase;">Volume</label>
        <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.86" style="width: 140px; accent-color: #dfe6ff;" />
      </div>

      <a-sky id="skybox" material="shader: skybox; color: #dfe7ff; side: back" audio-reactive-sky></a-sky>

      <!-- Procedurally generated grass texture (runs immediately so it's -->
      <!-- available in the DOM before the cube's material tries to load it) -->
      <script>
        (function () {
          const canvas = document.createElement('canvas');
          canvas.id = 'grassCanvas';
          canvas.width = 256;
          canvas.height = 256;
          canvas.style.display = 'none';
          const ctx = canvas.getContext('2d');

          const gradient = ctx.createLinearGradient(0, 0, 0, 256);
          gradient.addColorStop(0, '#3f8f2a');
          gradient.addColorStop(1, '#2c5e1a');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 256, 256);

          for (let i = 0; i < 6000; i++) {
            const x = Math.random() * 256;
            const y = Math.random() * 256;
            const len = 3 + Math.random() * 7;
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.9;
            const shade = 60 + Math.floor(Math.random() * 100);
            ctx.strokeStyle = `rgba(${20 + Math.random() * 40}, ${shade}, ${20 + Math.random() * 30}, 0.85)`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
            ctx.stroke();
          }

          document.body.appendChild(canvas);
        })();

        (function () {
          const img = new Image();
          img.id = 'noiseTexture';
          img.src = './-noise.gif';
          img.crossOrigin = 'anonymous';
          img.style.position = 'fixed';
          img.style.left = '-9999px';
          img.style.top = '-9999px';
          img.style.display = 'block';
          document.body.appendChild(img);
        })();
      </script>

      <!-- Mouse cursor for desktop click interaction -->
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

      <!-- Ground with ripple shader -->
      <a-entity id="ripple-surface"
                geometry="primitive: plane; width: 30; height: 30"
                rotation="-90 0 0"
                position="0 0 0"  
                material="shader: ripple"
                shadow="receive: false">
      </a-entity>

      <!-- Rotating and pulsing cube -->
      <a-box id="cube"
             class="clickable"
             pulse-on-click
             spark-on-click
             position="0 2 -3"
             width="1.2" height="1.2" depth="1.2"
             color="#ffffff"
             material="src: #noiseTexture; color: #ffffff; metalness: 0.08; roughness: 0.8; transparent: false; wireframe: false"
             shadow="cast: true"
             animation__rotate="property: rotation; to: 360 360 360; loop: true; dur: 6000; easing: linear"
             animation__grow="property: scale; startEvents: pulse; from: 1 1 1; to: 1.8 1.8 1.8; dur: 300; easing: easeOutSine"
             animation__shrink="property: scale; startEvents: resetScale; to: 1 1 1; dur: 300; easing: easeInOutSine">
      </a-box>

      <!-- Spotlight with smooth color cycling -->
      <a-entity id="colorSpot"
                light="type: spot; intensity: 4.8; angle: 85; penumbra: 1.1; decay: 2; distance: 36; castShadow: true"
                position="1 8 2"
                rotation="-65 -15 0"
                target="#cube"
                smooth-color-cycler>
      </a-entity>

      <!-- Ambient light -->
      <a-entity light="type: ambient; color: #dfe6ff; intensity: 0.18"></a-entity>

      <!-- Camera -->
      <a-entity camera look-controls wasd-controls position="0 1.6 5"></a-entity>

      <!-- Ripple Shader -->
      <script>
        AFRAME.registerShader('ripple', {
          schema: {
            time: { type: 'time', is: 'uniform' },
            color: { type: 'color', default: '#1a1a1a', is: 'uniform' }
          },
          vertexShader: `
            varying vec2 vUV;
            void main() {
              vUV = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            precision mediump float;
            uniform float time;
            uniform vec3 color;
            varying vec2 vUV;

            void main() {
              float dist = distance(vUV, vec2(0.5));
              float ripple = 0.5 + 0.5 * sin(40.0 * dist - time * 0.005);
              vec3 finalColor = color * ripple;
              gl_FragColor = vec4(finalColor, 1.0);
            }
          `
        });

        AFRAME.registerShader('skybox', {
          schema: {
            time: { type: 'time', is: 'uniform' },
            color: { type: 'color', default: '#dfe7ff', is: 'uniform' },
            audioBass: { type: 'number', default: 0, is: 'uniform' },
            audioMid: { type: 'number', default: 0, is: 'uniform' },
            audioTreble: { type: 'number', default: 0, is: 'uniform' }
          },
          vertexShader: `
            varying vec2 vUV;
            varying vec3 vWorldPos;
            void main() {
              vUV = uv;
              vec4 worldPos = modelMatrix * vec4(position, 1.0);
              vWorldPos = worldPos.xyz;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            precision mediump float;
            uniform float time;
            uniform vec3 color;
            uniform float audioBass;
            uniform float audioMid;
            uniform float audioTreble;
            varying vec2 vUV;
            varying vec3 vWorldPos;

            void main() {
              vec2 uv = vUV * 2.0 - 1.0;
              float horizon = smoothstep(-0.8, 1.0, uv.y);
              vec3 zenith = vec3(0.12, 0.18, 0.32);
              vec3 horizonColor = vec3(0.90, 0.82, 0.96);
              vec3 sky = mix(zenith, horizonColor, horizon);

              float cloudSpeed = 1.0 + audioMid * 3.0;
              float cloudBand = sin((uv.x * 9.0 + uv.y * 6.0) * 2.0 - time * 0.00015 * cloudSpeed) * 0.5 + 0.5;
              float cloudWave = sin((uv.x * 14.0 - uv.y * 8.0) + time * 0.0002 * cloudSpeed) * 0.5 + 0.5;
              float mist = smoothstep(0.25, 1.0, cloudBand * cloudWave);
              sky = mix(sky, vec3(1.0, 0.98, 1.0), mist * (0.12 + audioTreble * 0.35));

              float glow = 1.0 - length(uv * vec2(1.0, 0.75));
              sky += vec3(0.14, 0.12, 0.22) * smoothstep(0.2, 1.0, glow) * (0.25 + audioBass * 0.9);

              sky += vec3(0.10, 0.05, 0.18) * audioBass * (0.4 + 0.6 * horizon);

              gl_FragColor = vec4(sky, 1.0);
            }
          `
        });
      </script>

      <!-- Pulse-on-click logic -->
      <script>
        (function () {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          let audioContext = null;
          let masterGain = null;
          let delayNode = null;
          let delayFeedback = null;
          let dryGain = null;
          let analyser = null;
          let audioDataArray = null;
          let currentVolume = 0.86;

          function ensureAudio() {
            if (!AudioCtx) return null;
            if (!audioContext) {
              audioContext = new AudioCtx();
              masterGain = audioContext.createGain();
              masterGain.gain.value = currentVolume;

              delayNode = audioContext.createDelay(1.5);
              delayFeedback = audioContext.createGain();
              dryGain = audioContext.createGain();

              delayNode.delayTime.value = 0.35;
              delayFeedback.gain.value = 0.34;
              dryGain.gain.value = 0.8;

              analyser = audioContext.createAnalyser();
              analyser.fftSize = 256;
              analyser.smoothingTimeConstant = 0.8;
              audioDataArray = new Uint8Array(analyser.frequencyBinCount);

              delayNode.connect(delayFeedback);
              delayFeedback.connect(delayNode);
              delayNode.connect(masterGain);
              dryGain.connect(masterGain);
              masterGain.connect(analyser);
              analyser.connect(audioContext.destination);
            }
            if (audioContext.state === 'suspended') {
              audioContext.resume();
            }
            return audioContext;
          }

          function getAudioLevels() {
            if (!analyser || !audioDataArray) {
              return { bass: 0, mid: 0, treble: 0, overall: 0 };
            }
            analyser.getByteFrequencyData(audioDataArray);
            const len = audioDataArray.length;
            const bassEnd = Math.floor(len * 0.15);
            const midEnd = Math.floor(len * 0.5);

            let bassSum = 0, midSum = 0, trebleSum = 0;
            for (let i = 0; i < bassEnd; i += 1) bassSum += audioDataArray[i];
            for (let i = bassEnd; i < midEnd; i += 1) midSum += audioDataArray[i];
            for (let i = midEnd; i < len; i += 1) trebleSum += audioDataArray[i];

            const bass = bassSum / (bassEnd * 255);
            const mid = midSum / ((midEnd - bassEnd) * 255);
            const treble = trebleSum / ((len - midEnd) * 255);
            const overall = (bassSum + midSum + trebleSum) / (len * 255);

            return { bass, mid, treble, overall };
          }

          function updateReverbLevel(value) {
            if (!audioContext || !delayNode || !delayFeedback || !dryGain) return;
            const amount = Number(value) || 0;
            const delayTime = 0.05 + amount * 0.95;
            const feedback = 0.12 + amount * 0.66;
            const dry = 1 - amount * 0.7;

            delayNode.delayTime.setTargetAtTime(delayTime, audioContext.currentTime, 0.08);
            delayFeedback.gain.setTargetAtTime(feedback, audioContext.currentTime, 0.08);
            dryGain.gain.setTargetAtTime(dry, audioContext.currentTime, 0.08);
          }

          function updateVolumeLevel(value) {
            currentVolume = Number(value) || 0;
            if (!audioContext || !masterGain) return;
            masterGain.gain.setTargetAtTime(currentVolume, audioContext.currentTime, 0.05);
          }

          function playTone({ frequency, start, duration, type = 'sine', gainValue = 0.04, detune = 0, filterFreq = 2200 }) {
            if (!audioContext || !masterGain) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, start);
            oscillator.detune.setValueAtTime(detune, start);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(filterFreq, start);
            filter.Q.value = 0.6;

            const scaledGain = gainValue * toneGainScale;
            const scaledDuration = duration * toneDurationScale;

            gainNode.gain.setValueAtTime(0.0001, start);
            gainNode.gain.exponentialRampToValueAtTime(scaledGain, start + 0.08);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, start + scaledDuration + 0.12);

            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(dryGain);
            gainNode.connect(delayNode);

            oscillator.start(start);
            oscillator.stop(start + scaledDuration + 0.18);
          }

          function playParticleHit() {
            if (!audioContext || !masterGain) return;

            const start = audioContext.currentTime;
            const profile = soundProfiles[activeSound] || soundProfiles['ambient-key'];
            const pitchUp = [1.5, 2, 3, 4][Math.floor(Math.random() * 4)];
            const root = lastRoot * pitchUp + (Math.random() - 0.5) * 6;

            toneGainScale = 0.14 + Math.random() * 0.06;
            toneDurationScale = 0.18;
            profile({ start, root });
            toneGainScale = 1;
            toneDurationScale = 1;
          }

          function playAmbientKey({ frequency, start, duration, gainValue = 0.04, detune = 0 }) {
            playTone({
              frequency,
              start,
              duration,
              type: 'sine',
              gainValue,
              detune,
              filterFreq: 1800 + Math.random() * 800
            });

            playTone({
              frequency: frequency * 2,
              start: start + 0.02,
              duration: duration + 0.2,
              type: 'triangle',
              gainValue: gainValue * 0.5,
              detune: detune * 0.5,
              filterFreq: 2600 + Math.random() * 1000
            });
          }

          const soundProfiles = {
            'ambient-key': ({ start, root }) => {
              const chord = [root, root * 1.25, root * 1.5];
              chord.forEach((freq, index) => {
                playAmbientKey({
                  frequency: freq,
                  start: start + index * 0.06,
                  duration: 1.8 + Math.random() * 0.6,
                  gainValue: 0.06 - index * 0.008,
                  detune: (index === 0 ? -2 : 4) + (Math.random() - 0.5) * 6
                });
              });
              playTone({
                frequency: root * 2 + (Math.random() - 0.5) * 8,
                start: start + 0.08,
                duration: 1.2,
                type: 'sine',
                gainValue: 0.028,
                detune: (Math.random() - 0.5) * 8,
                filterFreq: 1500
              });
            },
            'glass-hum': ({ start, root }) => {
              playTone({
                frequency: root,
                start,
                duration: 1.4,
                type: 'triangle',
                gainValue: 0.14,
                detune: 6,
                filterFreq: 4200
              });
              playTone({
                frequency: root * 1.25,
                start: start + 0.04,
                duration: 1.8,
                type: 'sine',
                gainValue: 0.07,
                detune: 0,
                filterFreq: 3400
              });
              playTone({
                frequency: root * 1.5,
                start: start + 0.08,
                duration: 1.6,
                type: 'sine',
                gainValue: 0.05,
                detune: -2,
                filterFreq: 2600
              });
            },
            'bell-tone': ({ start, root }) => {
              [root, root * 1.25, root * 1.5, root * 2].forEach((freq, index) => {
                playTone({
                  frequency: freq,
                  start: start + index * 0.04,
                  duration: 2.2,
                  type: 'sine',
                  gainValue: 0.08 - index * 0.01,
                  detune: 0,
                  filterFreq: 7000
                });
              });
            },
            'drone-hit': ({ start, root }) => {
              playTone({
                frequency: root * 0.5,
                start,
                duration: 2.2,
                type: 'sawtooth',
                gainValue: 0.075,
                detune: -4,
                filterFreq: 900
              });
              playTone({
                frequency: root * 1.25,
                start: start + 0.06,
                duration: 1.1,
                type: 'triangle',
                gainValue: 0.13,
                detune: 4,
                filterFreq: 1800
              });
              playTone({
                frequency: root * 1.5,
                start: start + 0.12,
                duration: 1.3,
                type: 'sine',
                gainValue: 0.055,
                detune: 2,
                filterFreq: 1600
              });
            },
            'soft-pluck': ({ start, root }) => {
              playTone({
                frequency: root,
                start,
                duration: 0.8,
                type: 'triangle',
                gainValue: 0.14,
                detune: 2,
                filterFreq: 2400
              });
              playTone({
                frequency: root * 1.25,
                start: start + 0.04,
                duration: 0.7,
                type: 'sine',
                gainValue: 0.07,
                detune: 5,
                filterFreq: 2000
              });
              playTone({
                frequency: root * 1.5,
                start: start + 0.08,
                duration: 0.8,
                type: 'sine',
                gainValue: 0.05,
                detune: 0,
                filterFreq: 1600
              });
            }
          };

          let activeSound = 'ambient-key';
          let lastRoot = 220;
          let toneGainScale = 1;
          let toneDurationScale = 1;

          function playCubeSound() {
            const ctx = ensureAudio();
            if (!ctx || !masterGain) return;

            const start = ctx.currentTime;
            const root = 196 + Math.random() * 40;
            lastRoot = root;
            const profile = soundProfiles[activeSound] || soundProfiles['ambient-key'];
            profile({ start, root });

            const backdrop = document.getElementById('ripple-backdrop');
            if (backdrop) {
              const currentColor = document.getElementById('cube').getAttribute('material').color || '#ffffff';
              backdrop.setAttribute('material', {
                color: currentColor,
                opacity: 0.55,
                transparent: true
              });
            }
          }

          document.querySelectorAll('[data-sound]').forEach(button => {
            button.addEventListener('click', () => {
              activeSound = button.dataset.sound;
              document.querySelectorAll('[data-sound]').forEach(btn => {
                btn.style.background = btn.dataset.sound === activeSound ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)';
              });
            });
          });

          const reverbSlider = document.getElementById('reverb-slider');
          if (reverbSlider) {
            reverbSlider.addEventListener('input', (event) => {
              updateReverbLevel(event.target.value);
            });
          }

          const volumeSlider = document.getElementById('volume-slider');
          if (volumeSlider) {
            updateVolumeLevel(volumeSlider.value);
            volumeSlider.addEventListener('input', (event) => {
              updateVolumeLevel(event.target.value);
            });
          }

          document.body.addEventListener('pointerdown', ensureAudio, { once: true });
          window.playCubeSound = playCubeSound;
          window.soundProfiles = soundProfiles;
          window.updateReverbLevel = updateReverbLevel;
          window.updateVolumeLevel = updateVolumeLevel;
          window.getAudioLevels = getAudioLevels;
          window.playParticleHit = playParticleHit;
        })();

        AFRAME.registerComponent('audio-reactive-sky', {
          init: function () {
            this.smoothed = { bass: 0, mid: 0, treble: 0 };
          },
          tick: function () {
            if (!window.getAudioLevels) return;
            const levels = window.getAudioLevels();
            const smoothing = 0.15;
            this.smoothed.bass += (levels.bass - this.smoothed.bass) * smoothing;
            this.smoothed.mid += (levels.mid - this.smoothed.mid) * smoothing;
            this.smoothed.treble += (levels.treble - this.smoothed.treble) * smoothing;

            this.el.setAttribute('material', {
              audioBass: this.smoothed.bass,
              audioMid: this.smoothed.mid,
              audioTreble: this.smoothed.treble
            });
          }
        });

        AFRAME.registerComponent('spark-on-click', {
          init: function () {
            const sceneEl = this.el.sceneEl;
            const rand = (min, max) => min + Math.random() * (max - min);
            this.bursts = [];

            this.createRipple = (x, z, color = '#a7f3d0') => {
              const ripple = document.createElement('a-ring');
              ripple.setAttribute('position', { x, y: 0.05, z });
              ripple.setAttribute('rotation', '-90 0 0');
              ripple.setAttribute('radius-inner', 0.06);
              ripple.setAttribute('radius-outer', 0.18);
              ripple.setAttribute('material', {
                color,
                emissive: color,
                emissiveIntensity: 0.8,
                transparent: true,
                opacity: 0.8
              });
              ripple.setAttribute('animation__grow', {
                property: 'scale',
                from: '0.3 0.3 0.3',
                to: '1.5 1.5 1.5',
                dur: 500,
                easing: 'easeOutQuad'
              });
              ripple.setAttribute('animation__fade', {
                property: 'material.opacity',
                from: 0.8,
                to: 0,
                dur: 500,
                easing: 'easeOutQuad'
              });
              sceneEl.appendChild(ripple);
              setTimeout(() => {
                if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
              }, 520);
            };

            this.el.addEventListener('click', (event) => {
              const intersection = event.detail && event.detail.intersection;
              const point = intersection && intersection.point
                ? intersection.point
                : new THREE.Vector3(0, 0, 0);
              const cubeColor = this.el.getAttribute('material').color || '#f3efe9';

              const burst = document.createElement('a-entity');
              burst.setAttribute('position', {
                x: point.x,
                y: point.y,
                z: point.z
              });

              const particles = [];
              for (let i = 0; i < 18; i += 1) {
                const particle = document.createElement('a-sphere');
                const hue = i % 2 === 0 ? '#ffd166' : '#ff7b00';
                particle.setAttribute('radius', rand(0.018, 0.04));
                particle.setAttribute('color', hue);
                particle.setAttribute('material', {
                  color: hue,
                  emissive: '#ffb703',
                  emissiveIntensity: 1,
                  transparent: true,
                  opacity: 0.95
                });

                const velocity = {
                  x: rand(-0.08, 0.08),
                  y: rand(0.02, 0.12),
                  z: rand(-0.08, 0.08)
                };

                burst.appendChild(particle);
                particles.push({
                  mesh: particle,
                  vx: velocity.x,
                  vy: velocity.y,
                  vz: velocity.z,
                  age: 0,
                  life: rand(0.35, 0.7),
                  gravity: -0.012,
                  rippleCreated: false
                });
              }

              sceneEl.appendChild(burst);
              this.bursts.push({ entity: burst, particles });
            });
          },
          tick: function (time, delta) {
            if (!this.bursts || !this.bursts.length) return;

            const step = delta / 16.6667;

            for (let i = this.bursts.length - 1; i >= 0; i -= 1) {
              const burst = this.bursts[i];
              const remaining = [];

              for (const particle of burst.particles) {
                particle.age += delta / 1000;
                if (particle.age >= particle.life) {
                  if (particle.mesh.parentNode) {
                    particle.mesh.parentNode.removeChild(particle.mesh);
                  }
                  continue;
                }

                particle.vy += particle.gravity * step;
                const current = particle.mesh.object3D.position;
                current.x += particle.vx * step;
                current.y += particle.vy * step;
                current.z += particle.vz * step;

                if (current.y <= 0.04 && !particle.rippleCreated) {
                  const cubeColor = this.el.getAttribute('material').color || '#f3efe9';
                  this.createRipple(current.x, current.z, cubeColor);
                  if (window.playParticleHit) window.playParticleHit();
                  particle.rippleCreated = true;
                }

                particle.mesh.setAttribute('material', {
                  color: particle.mesh.getAttribute('color'),
                  emissive: '#ffb703',
                  emissiveIntensity: 0.8,
                  transparent: true,
                  opacity: Math.max(0, 1 - particle.age / particle.life)
                });

                remaining.push(particle);
              }

              burst.particles = remaining;

              if (!remaining.length) {
                if (burst.entity.parentNode) {
                  burst.entity.parentNode.removeChild(burst.entity);
                }
                this.bursts.splice(i, 1);
              }
            }
          }
        });

        AFRAME.registerComponent('pulse-on-click', {
          init: function () {
            const el = this.el;
            const palette = ['#f3efe9', '#d7c2a5', '#b8d7c5', '#c8d4ff', '#f0b5c7', '#d8d8a5'];
            let index = 0;

            el.addEventListener('click', () => {
              index = (index + 1) % palette.length;
              const nextColor = palette[index];
              el.setAttribute('color', nextColor);
              el.setAttribute('material', {
                color: nextColor,
                metalness: 0.12,
                roughness: 0.38,
                wireframe: true
              });

              if (window.playCubeSound) {
                window.playCubeSound();
              }
              el.emit('pulse');
              setTimeout(() => {
                el.emit('resetScale');
                el.setAttribute('material', 'wireframe', false);
              }, 500);
            });
          }
        });
      </script>

      <!-- Smooth spotlight color cycle -->
      <script>
        AFRAME.registerComponent('smooth-color-cycler', {
          schema: {
            colors: { default: ['#3399ff', '#9933ff', '#33cc33', '#ff3333'] },
            duration: { default: 2000 }
          },
          init: function () {
            const el = this.el;
            const colors = this.data.colors;
            const duration = this.data.duration;
            let index = 0;

            const cycle = () => {
              const nextColor = colors[(index + 1) % colors.length];
              el.setAttribute('animation__lightcolor', {
                property: 'light.color',
                to: nextColor,
                dur: duration,
                easing: 'linear'
              });
              index = (index + 1) % colors.length;
              setTimeout(cycle, duration);
            };

            cycle();
          }
        });
      </script>

    </a-scene>
  </body>
</html>
